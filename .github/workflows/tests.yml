name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Test
        run: python -m pytest -q

      - name: Set up Node for portable page comparison tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test portable comparison logic
        run: node --test tests/test_portable.js

      - name: Verify portable page is reproducible
        run: |
          python scripts/build_static_page.py
          git diff --exit-code -- docs/IBM-Patchwatch.html

  ansible:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ansible
        run: python -m pip install -r ansible/requirements-controller.txt
      - name: Test installation identity checks
        run: python -m unittest discover -s ansible/tests -p 'test_*.py' -v
      - name: Check Ansible syntax
        working-directory: ansible
        run: |
          ansible-playbook -i inventories/example/hosts.yml playbooks/preflight_was.yml --syntax-check
          ansible-playbook -i inventories/example/hosts.yml playbooks/stage_was.yml --syntax-check
