name: Refresh IBM metadata catalog

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - refresh-ibm-catalog
  release:
    types:
      - published
      - edited
  schedule:
    - cron: "17 3 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-ibm-catalog.yml"
      - "scripts/update_ibm_catalog.py"
      - "src/ibm_patchwatch/providers/**"

# Several provider commits can arrive within seconds.  Only one refresh is
# allowed to publish at a time; a newer run supersedes an older in-progress run.
concurrency:
  group: ibm-catalog-refresh-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync with latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Refresh catalog from official IBM sources
        env:
          PYTHONPATH: src
        run: python scripts/update_ibm_catalog.py

      - name: Commit and publish refreshed catalog
        run: |
          if git diff --quiet -- data/ibm/catalog.json; then
            echo "IBM catalog unchanged"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ibm/catalog.json
          git commit -m "chore: refresh IBM metadata catalog"

          # main can still move because of an unrelated human/CI commit between
          # checkout and push. Rebase once on the latest main and retry safely.
          if ! git push origin HEAD:main; then
            echo "main moved while the catalog was being refreshed; rebasing"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
