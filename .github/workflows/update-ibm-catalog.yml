name: Refresh IBM metadata catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh catalog from official IBM sources
        env:
          PYTHONPATH: src
        run: python scripts/update_ibm_catalog.py

      - name: Commit changed catalog
        run: |
          if git diff --quiet -- data/ibm/catalog.json; then
            echo "IBM catalog unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ibm/catalog.json
          git commit -m "chore: refresh IBM metadata catalog"
          git push
