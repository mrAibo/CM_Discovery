---
# Vier Beispielserver. Die .invalid-Adressen und Benutzer vor SSH-Läufen ersetzen.
# Der Controller-Scan kann ohne Verbindung zu diesen Servern verwendet werden.
all:
  children:
    ibm_servers:
      children:
        hb:
          hosts:
            HB_TEST:
              ansible_host: hb-test.example.invalid
              deployment_environment: test
            HB_PROD:
              ansible_host: hb-prod.example.invalid
              deployment_environment: production
        ndd:
          hosts:
            NDD_TEST:
              ansible_host: ndd-test.example.invalid
              deployment_environment: test
            NDD_PROD:
              ansible_host: ndd-prod.example.invalid
              deployment_environment: production
    # Alternative Auswahl: --limit test oder --limit production.
    test:
      hosts:
        HB_TEST: {}
        NDD_TEST: {}
    production:
      hosts:
        HB_PROD: {}
        NDD_PROD: {}
    # Dieselben Hosts stehen für die vorhandenen WAS-Playbooks zur Verfügung.
    # Preflight/Staging verlangen weiterhin genau einen Host per --limit.
    ibm_was:
      children:
        ibm_servers: {}
