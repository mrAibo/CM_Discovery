---
# Tatsächlicher Installationsaufruf; vorhandenen vollständigen Zielstand überspringen.
# Fehler stoppen den Ablauf. Dienste werden dann nicht pauschal neu gestartet.
- name: IBM Installation Manager installieren und prüfen
  ibm_install_product:
    job: "{{ ibm_install_prepared.installation_manager.job }}"
    media: "{{ ibm_install_prepared.installation_manager.media }}"
    log_directory: "{{ ibm_install_run_directory }}/installation_manager/install-logs"
  become: true
  register: product_result

- name: Ergebnis für IBM Installation Manager festhalten
  ansible.builtin.set_fact:
    ibm_install_results: "{{ ibm_install_results | combine({'installation_manager': product_result}) }}"
