---
# Tatsächlicher Installationsaufruf; vorhandenen vollständigen Zielstand überspringen.
# Fehler stoppen den Ablauf. Dienste werden dann nicht pauschal neu gestartet.
- name: WebSphere und unabhängige iFixes installieren und prüfen
  ibm_install_product:
    job: "{{ ibm_install_prepared.websphere.job }}"
    media: "{{ ibm_install_prepared.websphere.media }}"
    log_directory: "{{ ibm_install_run_directory }}/websphere/install-logs"
  become: true
  register: product_result

- name: Ergebnis für WebSphere und unabhängige iFixes festhalten
  ansible.builtin.set_fact:
    ibm_install_results: "{{ ibm_install_results | combine({'websphere': product_result}) }}"
