---
# Tatsächlicher Installationsaufruf; vorhandenen vollständigen Zielstand überspringen.
# Fehler stoppen den Ablauf. Dienste werden dann nicht pauschal neu gestartet.
- name: IBM Java SDK installieren und prüfen
  ibm_install_product:
    job: "{{ ibm_install_prepared.ibm_java.job }}"
    media: "{{ ibm_install_prepared.ibm_java.media }}"
    log_directory: "{{ ibm_install_run_directory }}/ibm_java/install-logs"
  become: true
  register: product_result

- name: Ergebnis für IBM Java SDK festhalten
  ansible.builtin.set_fact:
    ibm_install_results: "{{ ibm_install_results | combine({'ibm_java': product_result}) }}"
