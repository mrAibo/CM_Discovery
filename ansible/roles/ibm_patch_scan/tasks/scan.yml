---
# Im Controller-Modus wird kein SSH-Aufruf auf dem IBM-Server ausgeführt.
- name: Heruntergeladene IBM-Pakete erfassen
  ibm_patch_scan:
    directory: "{{ ibm_patch_directory }}"
    recursive: "{{ ibm_patch_scan_recursive }}"
    # Jeden gewünschten iFix verlangen; keine Reduktion auf den höchsten IF.
    required_filenames: "{{ ibm_patch_required_filenames }}"
  delegate_to: "{{ 'localhost' if ibm_patch_scan_location == 'controller' else inventory_hostname }}"
  become: "{{ false if ibm_patch_scan_location == 'controller' else ibm_patch_scan_become }}"
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python if ibm_patch_scan_location == 'controller' else hostvars[inventory_hostname].ansible_python_interpreter }}"
  register: ibm_patch_scan_result

