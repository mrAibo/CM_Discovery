---
# Das WAS-SDK gehört nicht zur eingebetteten ICCSAP-JRE.
# Keine Installation, keine automatische Auswahl einer höchsten Version.
- name: IBM Java für WebSphere – Paketgruppen übernehmen
  ansible.builtin.set_fact:
    ibm_patch_products: "{{ ibm_patch_products | combine({'ibm_java': ibm_patch_scan_result.products.ibm_java}) }}"

- name: IBM Java für WebSphere – vorhandene Dateien anzeigen
  ansible.builtin.debug:
    msg:
      produkt: "IBM Java für WebSphere"
      status: "{{ ibm_patch_products.ibm_java.status }}"
      dateien: "{{ ibm_patch_scan_result.packages | selectattr('product', 'equalto', 'ibm_java') | map(attribute='filename') | list }}"
      explizit_ausgewaehlt: "{{ ibm_patch_products.ibm_java.selected_filenames }}"
      hinweis: "Das WAS-SDK gehört nicht zur eingebetteten ICCSAP-JRE."
