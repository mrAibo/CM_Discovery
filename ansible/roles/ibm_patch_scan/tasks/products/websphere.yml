---
# Fix Packs und nicht kumulative iFixes getrennt halten; keinen APAR automatisch aussortieren.
# Keine Installation, keine automatische Auswahl einer höchsten Version.
- name: IBM WebSphere – Paketgruppen übernehmen
  ansible.builtin.set_fact:
    ibm_patch_products: "{{ ibm_patch_products | combine({'websphere': ibm_patch_scan_result.products.websphere}) }}"

- name: IBM WebSphere – vorhandene Dateien anzeigen
  ansible.builtin.debug:
    msg:
      produkt: "IBM WebSphere"
      status: "{{ ibm_patch_products.websphere.status }}"
      dateien: "{{ ibm_patch_scan_result.packages | selectattr('product', 'equalto', 'websphere') | map(attribute='filename') | list }}"
      explizit_ausgewaehlt: "{{ ibm_patch_products.websphere.selected_filenames }}"
      hinweis: "Fix Packs und nicht kumulative iFixes getrennt halten; keinen APAR automatisch aussortieren."
