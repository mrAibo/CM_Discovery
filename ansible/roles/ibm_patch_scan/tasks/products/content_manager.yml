---
# CM-Fix-Pack-Medien erfassen; daraus keine erfolgte Datenbankkonfiguration ableiten.
# Keine Installation, keine automatische Auswahl einer höchsten Version.
- name: IBM Content Manager – Paketgruppen übernehmen
  ansible.builtin.set_fact:
    ibm_patch_products: "{{ ibm_patch_products | combine({'content_manager': ibm_patch_scan_result.products.content_manager}) }}"

- name: IBM Content Manager – vorhandene Dateien anzeigen
  ansible.builtin.debug:
    msg:
      produkt: "IBM Content Manager"
      status: "{{ ibm_patch_products.content_manager.status }}"
      dateien: "{{ ibm_patch_scan_result.packages | selectattr('product', 'equalto', 'content_manager') | map(attribute='filename') | list }}"
      explizit_ausgewaehlt: "{{ ibm_patch_products.content_manager.selected_filenames }}"
      hinweis: "CM-Fix-Pack-Medien erfassen; daraus keine erfolgte Datenbankkonfiguration ableiten."
