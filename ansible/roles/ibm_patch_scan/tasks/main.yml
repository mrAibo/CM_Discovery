---
# Gemeinsame Prüfung und genau ein Scan; danach verständliche Produkt-Tasks.
- name: Eingaben für die Paketvorbereitung prüfen
  ansible.builtin.import_tasks: validate.yml

- name: Downloadverzeichnis einmal erfassen
  ansible.builtin.import_tasks: scan.yml

# Bei wiederholtem Rollenaufruf keine Ergebnisse eines älteren Scans behalten.
- name: Produktübersicht initialisieren
  ansible.builtin.set_fact:
    ibm_patch_products: {}

- name: IBM Installation Manager zuordnen
  ansible.builtin.import_tasks: products/installation_manager.yml

- name: IBM Db2 zuordnen
  ansible.builtin.import_tasks: products/db2.yml

- name: IBM WebSphere zuordnen
  ansible.builtin.import_tasks: products/websphere.yml

- name: IBM Java für WebSphere zuordnen
  ansible.builtin.import_tasks: products/ibm_java.yml

- name: IBM Content Manager zuordnen
  ansible.builtin.import_tasks: products/content_manager.yml

- name: IBM Content Navigator zuordnen
  ansible.builtin.import_tasks: products/content_navigator.yml

- name: IBM Content Collector for SAP zuordnen
  ansible.builtin.import_tasks: products/iccsap.yml

# Unbekannte Dateien und Probleme bleiben sichtbar und werden nicht zugeordnet.
- name: Ungeklärte Dateien anzeigen
  ansible.builtin.debug:
    msg:
      unbekannte_dateien: "{{ ibm_patch_scan_result.packages | selectattr('product', 'equalto', 'unknown') | map(attribute='filename') | list }}"
      doppelte_dateinamen: "{{ ibm_patch_scan_result.duplicates }}"
      abgelehnte_dateien: "{{ ibm_patch_scan_result.rejected }}"

# Dynamisch, damit YaCompress für normale Scans keine Pflichtabhängigkeit wird.
- name: Archive zusätzlich mit YaCompress prüfen
  ansible.builtin.include_tasks: verify_archives.yml
  when: ibm_patch_verify_with_yacompress | bool

- name: Lesende Paketübersicht zusammenstellen
  ansible.builtin.set_fact:
    ibm_patch_plan:
      schema_version: 1
      purpose: package_preparation
      inventory_host: "{{ inventory_hostname }}"
      scan_location: "{{ ibm_patch_scan_location }}"
      directory: "{{ ibm_patch_scan_result.directory }}"
      products: "{{ ibm_patch_products }}"
      unknown_packages: "{{ ibm_patch_scan_result.packages | selectattr('product', 'equalto', 'unknown') | list }}"
      duplicates: "{{ ibm_patch_scan_result.duplicates }}"
      rejected: "{{ ibm_patch_scan_result.rejected }}"
      archive_verification: "{{ ('passed_for_scanned_packages' if ibm_patch_scan_result.packages | length > 0 else 'no_archives_tested') if ibm_patch_verify_with_yacompress | bool else 'not_requested' }}"
      applicability: not_verified
      installation_actions: []

- name: Private Scan- und Produktberichte schreiben
  ansible.builtin.import_tasks: report.yml
